<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!--Navbar-->
    <header>
        <nav class="navbar">
            <h1 class="logo">HR Cloud Contact Us</h1>
            <ul class="nav-links">
                <li><a href="home.html" class="active">Home</a></li>
                <li><a href="service.html" class="active">Services</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="about.html" class="active">About</a></li>
            </ul>
        </nav>
    </header>

    <!--Contact Section-->
    <section class="contact-section">
        <div class="contact-container">
            <div class="form-section">
                <h2>Get in Touch</h2>
                <form id="contactFrom">
                    <input type="text" name="name" placeholder="Your name" required>
                    <input type="email" name="email" placeholder="Your email" required>
                    <textarea name="message" row="5" placeholder="Your name" required></textarea>
                    <button type="submit">Send Message</button>
                </form>
            </div>

            <div class="info-section">
                <h2>Contact Info</h2>
                <p><i class="fas fa-map-marker-alt"></i>123 Main St, City, Country</p>
                <p><i class="fas fa-phone"></i> +123 456 7890</p>
                <p><i class="fas fa-envelope"></i>info@mycompany.com</p>
            </div>

            <div class="social-icons">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>

    <!--Footer-->
    <footer>
        <p>&copy; 2025 mycompany. All rights reserved.</p>
    </footer>
</body>
</html>
